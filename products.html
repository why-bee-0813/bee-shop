<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>商品页 · 小蜜蜂的神秘商店</title>
  <style>
    :root {
      --ink: #2f2528;
      --muted: #7b686e;
      --line: #f2d9df;
      --paper: #ffffff;
      --soft: #fff7df;
      --pink: #f7a9bd;
      --pink-strong: #e75f8b;
      --yellow: #ffd45c;
      --white: #ffffff;
      --max: 1120px;
      --side: clamp(18px, 4vw, 40px);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: "Inter", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 0%, rgba(247, 169, 189, 0.24), transparent 30rem),
        radial-gradient(circle at 88% 4%, rgba(255, 212, 92, 0.22), transparent 28rem),
        linear-gradient(180deg, #fff8fb 0%, #ffffff 42%, #fff9e8 100%);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    .page,
    footer {
      width: min(var(--max), calc(100% - var(--side) * 2));
      margin-inline: auto;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: clamp(18px, 3vw, 26px) 0;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      min-width: 0;
      gap: 12px;
      font-weight: 700;
    }

    .brand-mark {
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(247, 169, 189, 0.5);
      border-radius: 50%;
      background: var(--white);
      color: #c94f78;
      font-size: 20px;
      box-shadow: 0 12px 30px rgba(247, 169, 189, 0.16);
    }

    .brand span:last-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      flex: 0 0 auto;
      gap: clamp(12px, 2vw, 22px);
      align-items: center;
      color: var(--muted);
      font-size: 14px;
    }

    .cart-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 36px;
      padding: 0 13px;
      border: 1px solid rgba(247, 169, 189, 0.42);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.82);
      color: #c94f78;
      font-weight: 800;
      cursor: pointer;
    }

    .cart-count {
      display: grid;
      place-items: center;
      min-width: 21px;
      height: 21px;
      padding: 0 6px;
      border-radius: 999px;
      background: var(--pink-strong);
      color: var(--white);
      font-size: 12px;
      line-height: 1;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 28px;
      align-items: end;
      padding: clamp(36px, 7vw, 70px) 0 clamp(28px, 5vw, 44px);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      color: #c94f78;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 34px;
      height: 1px;
      background: currentColor;
    }

    h1,
    h2,
    h3,
    p {
      overflow-wrap: anywhere;
    }

    h1 {
      margin: 0;
      max-width: 760px;
      font-size: clamp(38px, 7vw, 76px);
      line-height: 1;
      letter-spacing: 0;
    }

    .intro {
      max-width: 620px;
      margin: 22px 0 0;
      color: var(--muted);
      font-size: clamp(16px, 2vw, 18px);
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 22px;
      border: 1px solid #f0a8b9;
      border-radius: 999px;
      color: var(--white);
      background: var(--pink-strong);
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease;
      box-shadow: 0 16px 32px rgba(231, 95, 139, 0.18);
    }

    .button.secondary {
      color: var(--ink);
      background: rgba(255, 255, 255, 0.78);
      box-shadow: none;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 36px rgba(247, 169, 189, 0.18);
    }

    .category-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 0 0 18px;
    }

    .category-tab {
      appearance: none;
      min-height: 42px;
      padding: 0 18px;
      border: 1px solid rgba(247, 169, 189, 0.42);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.74);
      color: var(--muted);
      font-weight: 800;
      cursor: pointer;
    }

    .category-tab.is-active {
      border-color: rgba(231, 95, 139, 0.5);
      background: #fff1f5;
      color: #c94f78;
    }

    .category-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      padding: 10px 0 18px;
    }

    .category-head h2 {
      margin: 0 0 8px;
      font-size: clamp(26px, 4vw, 42px);
      line-height: 1.1;
    }

    .category-head p {
      max-width: 660px;
      margin: 0;
      color: var(--muted);
    }

    .category-tools {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .category-tools .button {
      padding: 10px 14px;
      min-height: 0;
      font-size: 13px;
    }

    .category-tools .button[hidden] {
      display: none;
    }

    .button[disabled] {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .catalog {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      padding: 18px 0 clamp(48px, 8vw, 72px);
    }

    .product {
      appearance: none;
      display: grid;
      grid-template-rows: 178px 1fr;
      min-width: 0;
      padding: 0;
      border: 1px solid rgba(247, 169, 189, 0.34);
      border-radius: 8px;
      overflow: hidden;
      background: var(--white);
      color: inherit;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 22px 54px rgba(247, 169, 189, 0.12);
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .product:hover {
      transform: translateY(-4px);
      box-shadow: 0 26px 62px rgba(247, 169, 189, 0.2);
    }

    .product-visual {
      display: grid;
      place-items: center;
      background:
        linear-gradient(135deg, rgba(255, 241, 245, 0.96), rgba(255, 247, 223, 0.92)),
        var(--soft);
    }

    .product-shape {
      width: 88px;
      height: 112px;
      border: 1px solid rgba(247, 169, 189, 0.42);
      background: linear-gradient(180deg, #ffffff, #fff7df);
      box-shadow: inset 14px -12px 26px rgba(247, 169, 189, 0.12), 0 18px 34px rgba(247, 169, 189, 0.18);
    }

    [data-shape="jar"] .product-shape {
      border-radius: 34px 34px 18px 18px;
    }

    [data-shape="round"] .product-shape {
      width: 112px;
      height: 112px;
      border-radius: 50%;
    }

    [data-shape="box"] .product-shape {
      width: 118px;
      height: 96px;
      border-radius: 8px;
    }

    [data-shape="pouch"] .product-shape {
      width: 104px;
      height: 116px;
      border-radius: 44px 44px 16px 16px;
      transform: rotate(-5deg);
    }

    .product-body {
      display: grid;
      gap: 14px;
      padding: clamp(18px, 3vw, 24px);
    }

    .product-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: start;
    }

    .product h3 {
      margin: 0;
      font-size: 19px;
      line-height: 1.2;
    }

    .product p {
      min-height: 52px;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .price {
      flex: 0 0 auto;
      color: #c94f78;
      font-weight: 900;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 4px 10px;
      border: 1px solid rgba(247, 169, 189, 0.38);
      border-radius: 999px;
      background: #fff8fb;
      color: #9e4869;
      font-size: 12px;
      font-weight: 800;
    }

    .product-action {
      color: #c94f78;
      font-weight: 900;
      font-size: 14px;
    }

    .order-strip {
      display: flex;
      justify-content: space-between;
      gap: 22px;
      align-items: center;
      margin-bottom: clamp(34px, 7vw, 58px);
      padding: clamp(24px, 5vw, 34px);
      border: 1px solid rgba(247, 169, 189, 0.34);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 22px 54px rgba(247, 169, 189, 0.12);
    }

    .order-strip h2 {
      margin: 0 0 8px;
      font-size: clamp(24px, 4vw, 38px);
      line-height: 1.1;
    }

    .order-strip p {
      margin: 0;
      color: var(--muted);
    }

    footer {
      padding: 0 0 46px;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    .modal,
    .cart-overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      background: rgba(47, 37, 40, 0.34);
    }

    .modal.is-open,
    .cart-overlay.is-open {
      display: block;
    }

    .modal {
      padding: var(--side);
      overflow: auto;
    }

    .modal-card {
      display: grid;
      grid-template-columns: minmax(260px, 0.8fr) minmax(0, 1fr);
      width: min(880px, 100%);
      margin: min(9vh, 80px) auto;
      overflow: hidden;
      border: 1px solid rgba(247, 169, 189, 0.4);
      border-radius: 8px;
      background: var(--white);
      box-shadow: 0 28px 80px rgba(47, 37, 40, 0.2);
    }

    .modal-visual {
      display: grid;
      place-items: center;
      min-height: 340px;
      background: linear-gradient(135deg, #fff1f5, #fff7df);
    }

    .modal-body {
      padding: clamp(22px, 5vw, 32px);
    }

    .modal-head,
    .cart-head,
    .cart-total {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: start;
    }

    .modal-title {
      margin: 0 0 8px;
      font-size: clamp(26px, 4vw, 42px);
      line-height: 1.1;
    }

    .modal-close,
    .cart-close {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 38px;
      height: 38px;
      border: 1px solid rgba(247, 169, 189, 0.42);
      border-radius: 50%;
      background: #fff8fb;
      color: #c94f78;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
    }

    .modal-body p {
      color: var(--muted);
    }

    .detail-list {
      margin: 18px 0 0;
      padding-left: 18px;
      color: var(--muted);
    }

    .modal-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }

    .cart-panel {
      position: fixed;
      top: 0;
      right: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      width: min(430px, 100%);
      height: 100%;
      padding: 22px;
      background: var(--white);
      box-shadow: -28px 0 72px rgba(47, 37, 40, 0.18);
      transform: translateX(100%);
      transition: transform 220ms ease;
    }

    .cart-overlay.is-open .cart-panel {
      transform: translateX(0);
    }

    .cart-head {
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }

    .cart-head h2 {
      margin: 0;
      font-size: 28px;
      line-height: 1.1;
    }

    .cart-head p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .cart-items {
      display: grid;
      align-content: start;
      gap: 12px;
      overflow: auto;
      padding: 18px 2px;
    }

    .cart-empty {
      display: grid;
      place-items: center;
      min-height: 240px;
      border: 1px dashed rgba(247, 169, 189, 0.58);
      border-radius: 8px;
      color: var(--muted);
      text-align: center;
      background: #fff8fb;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr);
      gap: 12px;
      padding: 12px;
      border: 1px solid rgba(247, 169, 189, 0.28);
      border-radius: 8px;
      background: #fffefe;
    }

    .cart-thumb {
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      border-radius: 8px;
      background: linear-gradient(135deg, #fff1f5, #fff7df);
    }

    .cart-thumb::before {
      content: "";
      width: 26px;
      height: 34px;
      border: 1px solid rgba(247, 169, 189, 0.45);
      border-radius: 12px 12px 6px 6px;
      background: #fff;
    }

    .cart-item-main {
      min-width: 0;
    }

    .cart-item-title {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: start;
      margin-bottom: 4px;
    }

    .cart-item h3 {
      margin: 0;
      font-size: 15px;
      line-height: 1.25;
    }

    .cart-item small {
      display: block;
      color: var(--muted);
      font-weight: 700;
    }

    .cart-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
    }

    .qty-controls {
      display: inline-grid;
      grid-template-columns: 32px 42px 32px;
      height: 32px;
      border: 1px solid rgba(247, 169, 189, 0.42);
      border-radius: 999px;
      overflow: hidden;
      background: #fff8fb;
    }

    .qty-controls button {
      border: 0;
      background: transparent;
      color: #c94f78;
      font-weight: 900;
      cursor: pointer;
    }

    .qty-controls span {
      display: grid;
      place-items: center;
      color: var(--ink);
      font-size: 14px;
      font-weight: 900;
    }

    .remove-item,
    .clear-cart {
      border: 0;
      background: transparent;
      color: #c94f78;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
    }

    .cart-foot {
      display: grid;
      gap: 14px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .cart-total {
      align-items: center;
      color: var(--muted);
      font-weight: 800;
    }

    .cart-total strong {
      color: var(--ink);
      font-size: 26px;
      line-height: 1;
    }

    .cart-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .floating-cart {
      position: fixed;
      right: clamp(16px, 4vw, 28px);
      bottom: clamp(16px, 4vw, 28px);
      z-index: 20;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 52px;
      padding: 0 18px;
      border: 1px solid rgba(247, 169, 189, 0.45);
      border-radius: 999px;
      background: var(--pink-strong);
      color: var(--white);
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 18px 36px rgba(231, 95, 139, 0.26);
    }

    .floating-cart .cart-count {
      background: var(--white);
      color: var(--pink-strong);
    }

    @media (max-width: 860px) {
      .hero,
      .category-head,
      .order-strip,
      .modal-card {
        grid-template-columns: 1fr;
      }

      .catalog {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 620px) {
      .nav {
        align-items: flex-start;
        flex-direction: column;
      }

      .nav-links {
        width: 100%;
        flex-wrap: wrap;
      }

      .hero {
        padding-top: 24px;
      }

      .catalog {
        grid-template-columns: 1fr;
      }

      .product {
        grid-template-rows: 150px 1fr;
      }

      .modal {
        padding: 12px;
      }

      .modal-card {
        margin: 24px auto;
      }

      .modal-visual {
        min-height: 220px;
      }

      .cart-panel {
        width: 100%;
      }

      .cart-actions {
        grid-template-columns: 1fr;
      }

      .floating-cart {
        right: 14px;
        bottom: 14px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <nav class="nav" aria-label="主导航">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">蜜</span>
        <span>小蜜蜂的神秘商店</span>
      </a>
      <div class="nav-links">
        <a href="index.html#about">介绍</a>
        <a href="products.html">商品</a>
        <a href="#order">下单</a>
        <button class="cart-link" id="navCartButton" type="button" aria-label="打开购物车">
          购物车 <span class="cart-count" data-cart-count>0</span>
        </button>
      </div>
    </nav>

    <section class="hero">
      <div>
        <span class="eyebrow">Mystery Catalog</span>
        <h1>本期商品</h1>
        <p class="intro">先按休闲零食区、饮品区、正餐区、娱乐区和学习区整理商品。点开商品可以查看详情并加入购物车，右侧悬浮窗会实时汇总数量和金额。</p>
      </div>
      <button class="button" id="heroCartButton" type="button">查看购物车</button>
    </section>

    <div class="category-tabs" id="categoryTabs" aria-label="商品分类"></div>
    <section class="category-head" aria-live="polite">
      <div>
        <h2 id="categoryTitle"></h2>
        <p id="categoryDescription"></p>
      </div>
      <div class="category-tools">
        <button class="button secondary" id="subcategoryBackButton" type="button" hidden>返回上一级</button>
        <span class="price" id="categoryCount"></span>
      </div>
    </section>
    <section class="catalog" id="catalog" aria-label="商品列表"></section>

    <section class="order-strip" id="order">
      <div>
        <h2>想要预订或咨询库存？</h2>
        <p>购物车里的商品会保存在本地浏览器中，可以随时打开悬浮购物车调整数量，再进入确认页核对清单并提交。</p>
      </div>
      <button class="button" id="stripCartButton" type="button">打开购物车</button>
    </section>
  </main>

  <footer>
    © 2026 小蜜蜂的神秘商店 · 让喜欢有回应 · 让心愿有着落
  </footer>

  <div class="modal" id="productModal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-visual" id="modalShapeWrap">
        <div class="product-shape" id="modalShape" aria-hidden="true"></div>
      </div>
      <div class="modal-body">
        <div class="modal-head">
          <div>
            <h2 class="modal-title" id="modalTitle"></h2>
            <span class="price" id="modalPrice"></span>
          </div>
          <button class="modal-close" type="button" aria-label="关闭详情">×</button>
        </div>
        <p id="modalDescription"></p>
        <div class="tag-row" id="modalTags"></div>
        <ul class="detail-list" id="modalDetails"></ul>
        <div class="modal-actions">
          <button class="button secondary" id="addCartButton" type="button">加入购物车</button>
          <button class="button" id="modalOrderButton" type="button">加入并确认</button>
        </div>
      </div>
    </div>
  </div>

  <div class="cart-overlay" id="cartOverlay" aria-hidden="true">
    <aside class="cart-panel" role="dialog" aria-modal="true" aria-labelledby="cartTitle">
      <div class="cart-head">
        <div>
          <h2 id="cartTitle">购物车</h2>
          <p id="cartSubtitle">已选择 0 件商品</p>
        </div>
        <button class="cart-close" id="cartCloseButton" type="button" aria-label="关闭购物车">×</button>
      </div>
      <div class="cart-items" id="cartItems"></div>
      <div class="cart-foot">
        <div class="cart-total">
          <span>商品合计</span>
          <strong id="cartTotal">¥0</strong>
        </div>
        <div class="cart-actions">
          <button class="button secondary clear-cart" id="clearCartButton" type="button">清空购物车</button>
          <a class="button" href="checkout.html" id="checkoutButton">确认订单</a>
        </div>
      </div>
    </aside>
  </div>

  <button class="floating-cart" id="floatingCartButton" type="button" aria-label="打开购物车">
    购物车 <span class="cart-count" data-cart-count>0</span>
  </button>

  <script>
    const shapeTypes = ["jar", "round", "box", "pouch"];
    const snackCategoryName = "休闲零食区";
    function createSnackProduct(name, summary, note, tags) {
      return {
        name,
        summary,
        details: [
          "价格：0元",
          `分类：${snackCategoryName}`,
          "库存：99+",
          `备注：${note}`
        ],
        tags: [snackCategoryName, ...tags]
      };
    }

    const snackProducts = [

      if (value === null || value === undefined || value === "") {

      return `¥${Number(value || 0).toFixed(0)}`;
    }

    function getCartTotal(cart) {
      if (cart.some((item) => item.price === null || item.price === undefined || item.price === "")) {
        return null;

      return cart.reduce((sum, item) => sum + item.price * item.quantity, 0);

        });
      }
      saveCart(cart);
    }

    function updateCartQuantity(productId, nextQuantity) {
      const cart = getCart()
        .map((item) => item.id === productId ? { ...item, quantity: Math.max(0, nextQuantity) } : item)
        .filter((item) => item.quantity > 0);
      saveCart(cart);
    }

    function removeCartItem(productId) {
      saveCart(getCart().filter((item) => item.id !== productId));
    }

    function renderCart() {
      const cart = getCart();
      const count = cart.reduce((total, item) => total + item.quantity, 0);
      const total = getCartTotal(cart);

      document.querySelectorAll("[data-cart-count]").forEach((node) => {
        node.textContent = String(count);
      });

      cartSubtitle.textContent = `已选择 ${count} 件商品`;
      cartTotal.textContent = formatPrice(total);
      checkoutButton.classList.toggle("secondary", count === 0);
      checkoutButton.setAttribute("aria-disabled", count === 0 ? "true" : "false");

      if (!cart.length) {
        cartItems.innerHTML = `
          <div class="cart-empty">
            <div>
              <strong>购物车还是空的</strong>
              <p>先选择喜欢的商品加入购物车。</p>
            </div>
          </div>
        `;
        return;
      }

      cartItems.innerHTML = cart.map((item) => `
        <article class="cart-item" data-id="${item.id}">
          <div class="cart-thumb" aria-hidden="true"></div>
          <div class="cart-item-main">
            <div class="cart-item-title">
              <div>
                <h3>${item.name}</h3>
                <small>${item.category}</small>
              </div>
              <strong>${formatPrice(item.price === null || item.price === undefined || item.price === "" ? null : item.price * item.quantity)}</strong>
            </div>
            <div class="cart-controls">
              <div class="qty-controls" aria-label="${item.name}数量">
                <button type="button" data-action="decrease" aria-label="减少数量">−</button>
                <span>${item.quantity}</span>
                <button type="button" data-action="increase" aria-label="增加数量">+</button>
              </div>
              <button class="remove-item" type="button" data-action="remove">删除</button>
            </div>
          </div>
        </article>
      `).join("");
    }

    function addCurrentProductToCart() {
      if (!currentProduct || currentProduct.unavailable) return;
      addProductToCart(currentProduct);
      addCartButton.textContent = "已加入购物车";
      window.setTimeout(() => {
        addCartButton.textContent = "加入购物车";
      }, 1100);
    }

    function orderCurrentProduct() {
      if (!currentProduct || currentProduct.unavailable) return;
      addProductToCart(currentProduct);
      window.location.href = "checkout.html";
    }

    catalog.addEventListener("click", (event) => {
      const productCard = event.target.closest(".product");
      if (!productCard) return;
      const category = categories[activeCategoryIndex];
      if (category.type === "subcategories" && productCard.dataset.subcategoryIndex !== undefined) {
        const nextSubcategoryIndex = Number(productCard.dataset.subcategoryIndex);
        const nextSubcategory = category.subcategories[nextSubcategoryIndex];
        if (category.name === "娱乐区" && nextSubcategory.mode !== "modules") {
          openModal(createEntertainmentDetailProduct(nextSubcategory));
          return;
        }
        activeSubcategoryIndex = nextSubcategoryIndex;
        activeModuleIndex = null;
        renderProducts();
        return;
      }

      if (category.name === "娱乐区" && activeSubcategoryIndex !== null) {
        const section = category.subcategories[activeSubcategoryIndex];
        if (section.mode === "modules" && activeModuleIndex === null) {
          activeModuleIndex = Number(productCard.dataset.index);
          renderProducts();
          return;
        }
      }

      const products = category.type === "subcategories" && activeSubcategoryIndex !== null
        ? category.name === "娱乐区" && activeModuleIndex !== null
          ? createEntertainmentProducts(category.subcategories[activeSubcategoryIndex].name, category.subcategories[activeSubcategoryIndex].modules[activeModuleIndex])
          : category.createChildProducts(category.subcategories[activeSubcategoryIndex].name)
        : category.products;
      openModal(products[Number(productCard.dataset.index)]);
    });

    categoryTabs.addEventListener("click", (event) => {
      const tab = event.target.closest(".category-tab");
      if (!tab) return;
      activeCategoryIndex = Number(tab.dataset.category);
      activeSubcategoryIndex = null;
      activeModuleIndex = null;
      renderCategoryTabs();
      renderProducts();
    });

    subcategoryBackButton.addEventListener("click", () => {
      if (activeModuleIndex !== null) {
        activeModuleIndex = null;
        renderProducts();
        return;
      }
      activeSubcategoryIndex = null;
      renderProducts();
    });

    closeButton.addEventListener("click", closeModal);
    addCartButton.addEventListener("click", addCurrentProductToCart);
    modalOrderButton.addEventListener("click", orderCurrentProduct);
    modal.addEventListener("click", (event) => {
      if (event.target === modal) closeModal();
    });

    cartButtons.forEach((button) => button.addEventListener("click", openCart));
    cartCloseButton.addEventListener("click", closeCart);
    cartOverlay.addEventListener("click", (event) => {
      if (event.target === cartOverlay) closeCart();
    });
    clearCartButton.addEventListener("click", () => saveCart([]));
    checkoutButton.addEventListener("click", (event) => {
      if (!getCart().length) event.preventDefault();
    });
    cartItems.addEventListener("click", (event) => {
      const itemNode = event.target.closest(".cart-item");
      const action = event.target.dataset.action;
      if (!itemNode || !action) return;

      const item = getCart().find((cartItem) => cartItem.id === itemNode.dataset.id);
      if (!item) return;

      if (action === "increase") updateCartQuantity(item.id, item.quantity + 1);
      if (action === "decrease") updateCartQuantity(item.id, item.quantity - 1);
      if (action === "remove") removeCartItem(item.id);
    });

    window.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      closeModal();
      closeCart();
    });

    renderCategoryTabs();
    renderProducts();
    renderCart();
  </script>
</body>
</html>
