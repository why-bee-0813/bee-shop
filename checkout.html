<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>下单 · 小蜜蜂的神秘商店</title>
  <style>
    :root {
      --ink: #2f2528;
      --muted: #7b686e;
      --line: #f2d9df;
      --paper: #ffffff;
      --soft: #fff7df;
      --pink: #f7a9bd;
      --pink-strong: #e75f8b;
      --yellow: #ffd45c;
      --white: #ffffff;
      --max: 980px;
      --side: clamp(18px, 4vw, 40px);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Inter", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 0%, rgba(247, 169, 189, 0.24), transparent 30rem),
        radial-gradient(circle at 88% 4%, rgba(255, 212, 92, 0.22), transparent 28rem),
        linear-gradient(180deg, #fff8fb 0%, #ffffff 42%, #fff9e8 100%);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page,
    footer {
      width: min(var(--max), calc(100% - var(--side) * 2));
      margin-inline: auto;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: clamp(18px, 3vw, 26px) 0;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      min-width: 0;
      gap: 12px;
      font-weight: 700;
    }

    .brand-mark {
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(247, 169, 189, 0.5);
      border-radius: 50%;
      background: var(--white);
      color: #c94f78;
      font-size: 20px;
      box-shadow: 0 12px 30px rgba(247, 169, 189, 0.16);
    }

    .nav-links {
      display: flex;
      flex: 0 0 auto;
      gap: clamp(14px, 3vw, 24px);
      color: var(--muted);
      font-size: 14px;
    }

    .hero {
      padding: clamp(34px, 7vw, 62px) 0 24px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      color: #c94f78;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 34px;
      height: 1px;
      background: currentColor;
    }

    h1,
    h2,
    h3,
    p {
      overflow-wrap: anywhere;
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 7vw, 72px);
      line-height: 1;
      letter-spacing: 0;
    }

    .intro {
      max-width: 660px;
      margin: 20px 0 0;
      color: var(--muted);
      font-size: clamp(16px, 2vw, 18px);
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin: 22px 0 24px;
    }

    .step {
      min-height: 54px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.72);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .step.is-active {
      border-color: rgba(231, 95, 139, 0.38);
      background: #fff1f5;
      color: #c94f78;
    }

    .checkout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 18px;
      align-items: start;
      padding-bottom: clamp(46px, 8vw, 72px);
    }

    .panel,
    .summary {
      border: 1px solid rgba(247, 169, 189, 0.34);
      border-radius: 8px;
      background: var(--white);
      box-shadow: 0 24px 58px rgba(247, 169, 189, 0.12);
    }

    .panel {
      padding: clamp(20px, 4vw, 30px);
    }

    .summary {
      position: sticky;
      top: 18px;
      padding: 22px;
    }

    .form-step {
      display: none;
    }

    .form-step.is-active {
      display: block;
    }

    h2 {
      margin: 0 0 18px;
      font-size: clamp(24px, 3.4vw, 34px);
      line-height: 1.12;
      letter-spacing: 0;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .field {
      display: grid;
      gap: 7px;
      margin-bottom: 16px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      color: var(--ink);
      font-size: 13px;
      font-weight: 800;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      background: #fff8fb;
      color: var(--ink);
      font: inherit;
      outline: none;
    }

    textarea {
      min-height: 96px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: rgba(231, 95, 139, 0.5);
      box-shadow: 0 0 0 3px rgba(247, 169, 189, 0.18);
    }

    .product-options,
    .pay-options {
      display: grid;
      gap: 10px;
    }

    .option {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff8fb;
      cursor: pointer;
    }

    .option input {
      width: auto;
      min-height: auto;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 24px;
    }

    .button {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 22px;
      border: 1px solid #f0a8b9;
      border-radius: 999px;
      color: var(--white);
      background: var(--pink-strong);
      cursor: pointer;
      font: inherit;
      font-size: 15px;
      font-weight: 800;
      text-align: center;
      transition: transform 180ms ease, box-shadow 180ms ease;
      box-shadow: 0 16px 32px rgba(231, 95, 139, 0.18);
    }

    .button.secondary {
      color: var(--ink);
      background: rgba(255, 255, 255, 0.78);
      box-shadow: none;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 36px rgba(247, 169, 189, 0.18);
    }

    .summary h3 {
      margin: 0 0 12px;
      font-size: 20px;
      line-height: 1.2;
    }

    .summary-list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
      color: var(--muted);
      font-size: 14px;
    }

    .summary-list li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }

    .summary-list strong {
      color: var(--ink);
      font-weight: 800;
      text-align: right;
    }

    .success {
      display: none;
      padding: clamp(24px, 5vw, 34px);
      border: 1px solid rgba(247, 169, 189, 0.34);
      border-radius: 8px;
      background: linear-gradient(135deg, #fff1f5 0%, #ffffff 54%, #fff7df 100%);
      box-shadow: 0 24px 58px rgba(247, 169, 189, 0.16);
    }

    .success.is-open {
      display: block;
    }

    .success-code {
      display: inline-flex;
      margin: 12px 0 0;
      padding: 8px 12px;
      border: 1px solid rgba(247, 169, 189, 0.42);
      border-radius: 999px;
      color: #c94f78;
      background: var(--white);
      font-weight: 800;
    }

    footer {
      padding: 0 0 46px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 820px) {
      .checkout {
        grid-template-columns: 1fr;
      }

      .summary {
        position: static;
      }

      .steps,
      .field-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {
      :root {
        --side: 14px;
      }

      .nav {
        align-items: flex-start;
        flex-direction: column;
      }

      .nav-links {
        width: 100%;
        justify-content: space-between;
        padding-top: 12px;
        border-top: 1px solid rgba(247, 169, 189, 0.24);
      }

      .actions {
        display: grid;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <nav class="nav" aria-label="主导航">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">蜂</span>
        <span>小蜜蜂的神秘商店</span>
      </a>
      <div class="nav-links">
        <a href="index.html#about">介绍</a>
        <a href="products.html">商品</a>
        <a href="checkout.html">下单</a>
      </div>
    </nav>

    <section class="hero">
      <span class="eyebrow">Checkout</span>
      <h1>确认下单</h1>
      <p class="intro">按常见网购流程填写：选商品、留联系方式、确认配送和备注，提交后生成一条本地订单记录。</p>
    </section>

    <div class="steps" aria-label="下单步骤">
      <div class="step is-active" data-step-label="0">1. 选择商品</div>
      <div class="step" data-step-label="1">2. 联系信息</div>
      <div class="step" data-step-label="2">3. 配送备注</div>
      <div class="step" data-step-label="3">4. 确认提交</div>
    </div>

    <section class="success" id="success">
      <h2>点单成功，我已经收到啦。</h2>
      <p>我会按提交顺序查看点单内容，并尽快确认后续安排。</p>
      <span class="success-code" id="orderCode"></span>
    </section>

    <form class="checkout" id="checkoutForm">
      <div class="panel">
        <section class="form-step is-active" data-step="0">
          <h2>选择想要的商品</h2>
          <div class="field">
            <label for="category">商品分类</label>
            <select id="category" name="category"></select>
          </div>
          <div class="field">
            <label for="product">商品名称</label>
            <select id="product" name="product"></select>
          </div>
          <div class="field-grid">
            <div class="field">
              <label for="quantity">数量</label>
              <input id="quantity" name="quantity" type="number" min="1" value="1" required>
            </div>
            <div class="field">
              <label for="spec">规格</label>
              <input id="spec" name="spec" type="text" placeholder="例如：奶茶 / 大杯 / 少冰 / 半糖">
            </div>
          </div>
          <div class="field">
            <label for="budget">预算或心理价位</label>
            <input id="budget" name="budget" type="text" placeholder="例如：100 元以内">
          </div>
        </section>

        <section class="form-step" data-step="1">
          <h2>填写联系信息</h2>
          <div class="field-grid">
            <div class="field">
              <label for="name">收件人</label>
              <input id="name" name="name" type="text" autocomplete="name" required>
            </div>
            <div class="field">
              <label for="phone">联系电话</label>
              <input id="phone" name="phone" type="tel" autocomplete="tel" required>
            </div>
            <div class="field full">
              <label for="contact">备用联系方式</label>
              <input id="contact" name="contact" type="text" placeholder="微信号、邮箱或其它联系方式">
            </div>
          </div>
        </section>

        <section class="form-step" data-step="2">
          <h2>配送和备注</h2>
          <div class="field">
            <label for="address">收货地址</label>
            <textarea id="address" name="address" autocomplete="street-address" required></textarea>
          </div>
          <div class="field">
            <label for="delivery">配送方式</label>
            <select id="delivery" name="delivery">
              <option value="快递配送">快递配送</option>
              <option value="同城自取">同城自取</option>
              <option value="先联系确认">先联系确认</option>
            </select>
          </div>
          <div class="field">
            <label for="note">订单备注</label>
            <textarea id="note" name="note" placeholder="口味偏好、送礼时间、祝福语等"></textarea>
          </div>
        </section>

        <section class="form-step" data-step="3">
          <h2>确认订单</h2>
          <div class="pay-options">
            <label class="option">
              <input type="radio" name="payment" value="提交后联系付款" checked>
              提交后联系付款
            </label>
            <label class="option">
              <input type="radio" name="payment" value="微信确认">
              微信确认
            </label>
            <label class="option">
              <input type="radio" name="payment" value="到店或自取付款">
              到店或自取付款
            </label>
          </div>
        </section>

        <div class="actions">
          <button class="button secondary" id="prevStep" type="button">上一步</button>
          <button class="button" id="nextStep" type="button">下一步</button>
        </div>
      </div>

      <aside class="summary" aria-label="订单摘要">
        <h3>订单摘要</h3>
        <ul class="summary-list">
          <li><span>分类</span><strong id="summaryCategory">休闲零食区</strong></li>
          <li><span>商品</span><strong id="summaryProduct">麻辣王子辣条</strong></li>
          <li><span>规格</span><strong id="summarySpec">未填写</strong></li>
          <li><span>数量</span><strong id="summaryQuantity">1</strong></li>
          <li><span>配送</span><strong id="summaryDelivery">快递配送</strong></li>
          <li><span>付款</span><strong id="summaryPayment">提交后联系付款</strong></li>
        </ul>
      </aside>
    </form>
  </main>

  <footer>
    © 2026 小蜜蜂的神秘商店 · 让喜欢有回应 · 让心愿有着落
  </footer>

  <script>
    const snackProductNames = [
      "麻辣王子辣条",
      "卫龙辣条",
      "卫龙魔芋爽",
      "卫龙亲嘴烧",
      "缺牙齿",
      "劲仔小鱼",
      "鸡脚筋",
      "火腿纯肉肠",
      "玉米火腿肠",
      "乐事薯片",
      "旺仔小馒头",
      "百醇",
      "趣多多",
      "好丽友派",
      "奥利奥",
      "板栗",
      "巧克力",
      "干脆面",
      "可比克薯片",
      "海苔片"
    ];
    const drinkBrandNames = [
      "茶颜悦色",
      "茶百道",
      "喜茶",
      "霸王茶姬",
      "蜜雪冰城",
      "茉酸奶",
      "CoCo都可",
      "古茗",
      "沪上阿姨"
    ];
    const createDrinkProductNames = (brandName) => Array.from(
      { length: 10 },
      (_, index) => `${brandName}待定商品 ${String(index + 1).padStart(2, "0")}`
    );
    const mealCuisineNames = [
      "汉堡薯条",
      "西餐",
      "火锅",
      "烧烤",
      "烤肉（烤鱼）",
      "日式料理",
      "韩式料理",
      "家常菜",
      "粤菜",
      "东北菜",
      "自助餐（烤肉自助、火锅自助）",
      "特色菜"
    ];
    const createMealProductNames = (cuisineName) => Array.from(
      { length: 5 },
      (_, index) => `${cuisineName}待定商品 ${String(index + 1).padStart(2, "0")}`
    );
    const entertainmentGameGroups = [
      {
        section: "电脑游戏陪玩",
        modules: ["无畏契约", "三角洲行动", "斗地主", "steam游戏"]
      },
      {
        section: "手机游戏陪玩",
        modules: ["洛克王国（hot！）", "王者荣耀", "心动小镇", "金铲铲之战", "三角洲行动（手游版）"]
      }
    ];
    const createEntertainmentProductNames = (moduleName) => Array.from(
      { length: 5 },
      (_, index) => `${moduleName}待定商品 ${String(index + 1).padStart(2, "0")}`
    );

    const categories = [
      {
        name: "休闲零食区",
        products: snackProductNames
      },
      ...drinkBrandNames.map((brandName) => ({
        name: `饮品区 / ${brandName}`,
        products: createDrinkProductNames(brandName)
      })),
      ...mealCuisineNames.map((cuisineName) => ({
        name: `正餐区 / ${cuisineName}`,
        products: createMealProductNames(cuisineName)
      })),
      ...entertainmentGameGroups.flatMap((group) => group.modules.map((moduleName) => ({
        name: `娱乐区 / ${group.section} / ${moduleName}`,
        products: createEntertainmentProductNames(moduleName)
      }))),
      {
        name: "学习区",
        products: Array.from({ length: 20 }, (_, index) => `学习区待定商品 ${String(index + 1).padStart(2, "0")}`)
      }
    ];

    const form = document.querySelector("#checkoutForm");
    const success = document.querySelector("#success");
    const orderCode = document.querySelector("#orderCode");
    const categorySelect = document.querySelector("#category");
    const productSelect = document.querySelector("#product");
    const quantityInput = document.querySelector("#quantity");
    const specInput = document.querySelector("#spec");
    const deliverySelect = document.querySelector("#delivery");
    const prevButton = document.querySelector("#prevStep");
    const nextButton = document.querySelector("#nextStep");
    const stepPanels = [...document.querySelectorAll(".form-step")];
    const stepLabels = [...document.querySelectorAll(".step")];
    const summaryCategory = document.querySelector("#summaryCategory");
    const summaryProduct = document.querySelector("#summaryProduct");
    const summarySpec = document.querySelector("#summarySpec");
    const summaryQuantity = document.querySelector("#summaryQuantity");
    const summaryDelivery = document.querySelector("#summaryDelivery");
    const summaryPayment = document.querySelector("#summaryPayment");

    let currentStep = 0;

    function getPaymentValue() {
      return new FormData(form).get("payment") || "提交后联系付款";
    }

    function renderCategories() {
      categorySelect.innerHTML = categories.map((category, index) => `<option value="${index}">${category.name}</option>`).join("");
    }

    function renderProducts(selectedProductName) {
      const category = categories[Number(categorySelect.value)];
      productSelect.innerHTML = category.products.map((product) => `<option value="${product}">${product}</option>`).join("");
      if (selectedProductName && category.products.includes(selectedProductName)) {
        productSelect.value = selectedProductName;
      }
    }

    function updateSummary() {
      summaryCategory.textContent = categories[Number(categorySelect.value)].name;
      summaryProduct.textContent = productSelect.value;
      summarySpec.textContent = specInput.value.trim() || "未填写";
      summaryQuantity.textContent = quantityInput.value || "1";
      summaryDelivery.textContent = deliverySelect.value;
      summaryPayment.textContent = getPaymentValue();
    }

    function setStep(step) {
      currentStep = step;
      stepPanels.forEach((panel, index) => panel.classList.toggle("is-active", index === currentStep));
      stepLabels.forEach((label, index) => label.classList.toggle("is-active", index === currentStep));
      prevButton.style.visibility = currentStep === 0 ? "hidden" : "visible";
      nextButton.textContent = currentStep === stepPanels.length - 1 ? "提交订单" : "下一步";
      updateSummary();
    }

    function validateCurrentStep() {
      const fields = [...stepPanels[currentStep].querySelectorAll("input, select, textarea")];
      return fields.every((field) => field.reportValidity());
    }

    function getApiUrl(path) {
      const isLocalHost = ["localhost", "127.0.0.1"].includes(window.location.hostname);
      const isStaticPreview = window.location.protocol === "file:" || (isLocalHost && window.location.port && window.location.port !== "3000");
      return isStaticPreview ? `http://127.0.0.1:3000${path}` : path;
    }

    async function submitOrder() {
      const data = Object.fromEntries(new FormData(form).entries());
      const order = {
        ...data,
        category: categories[Number(categorySelect.value)].name,
        product: productSelect.value,
        spec: specInput.value.trim() || "未填写",
        submittedAt: new Date().toISOString()
      };

      nextButton.disabled = true;
      nextButton.textContent = "提交中";

      const response = await fetch(getApiUrl("/api/orders"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(order)
      });

      if (!response.ok) {
        throw new Error("订单提交失败");
      }

      const result = await response.json();
      orderCode.textContent = result.orderCode ? `订单编号：${result.orderCode}` : "";
      success.classList.add("is-open");
      form.style.display = "none";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    categorySelect.addEventListener("change", () => {
      renderProducts();
      updateSummary();
    });
    form.addEventListener("input", updateSummary);
    form.addEventListener("change", updateSummary);
    prevButton.addEventListener("click", () => setStep(Math.max(0, currentStep - 1)));
    nextButton.addEventListener("click", async () => {
      if (!validateCurrentStep()) return;
      if (currentStep === stepPanels.length - 1) {
        try {
          await submitOrder();
        } catch (error) {
          console.error(error);
          nextButton.disabled = false;
          nextButton.textContent = "提交订单";
          alert("提交失败，请稍后再试。");
        }
        return;
      }
      setStep(currentStep + 1);
    });

    renderCategories();

    const query = new URLSearchParams(window.location.search);
    const selectedProduct = query.get("product");
    const selectedCategory = query.get("category");
    const exactCategoryIndex = categories.findIndex((category) => (
      category.name === selectedCategory && category.products.includes(selectedProduct)
    ));
    const selectedCategoryIndex = exactCategoryIndex >= 0
      ? exactCategoryIndex
      : categories.findIndex((category) => category.products.includes(selectedProduct));
    if (selectedCategoryIndex >= 0) {
      categorySelect.value = String(selectedCategoryIndex);
    }
    renderProducts(selectedProduct);
    setStep(0);
  </script>
