<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>下单 · 小蜜蜂的神秘商店</title>
  <style>
    :root {
      --ink: #2f2528;
      --muted: #7b686e;
      --line: #f2d9df;
      --paper: #ffffff;
      --soft: #fff7df;
      --pink: #f7a9bd;
      --pink-strong: #e75f8b;
      --yellow: #ffd45c;
      --white: #ffffff;
      --max: 980px;
      --side: clamp(18px, 4vw, 40px);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Inter", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 0%, rgba(247, 169, 189, 0.24), transparent 30rem),
        radial-gradient(circle at 88% 4%, rgba(255, 212, 92, 0.22), transparent 28rem),
        linear-gradient(180deg, #fff8fb 0%, #ffffff 42%, #fff9e8 100%);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page,
    footer {
      width: min(var(--max), calc(100% - var(--side) * 2));
      margin-inline: auto;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: clamp(18px, 3vw, 26px) 0;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      min-width: 0;
      gap: 12px;
      font-weight: 700;
    }

    .brand-mark {
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(247, 169, 189, 0.5);
      border-radius: 50%;
      background: var(--white);
      color: #c94f78;
      font-size: 20px;
      box-shadow: 0 12px 30px rgba(247, 169, 189, 0.16);
    }

    .nav-links {
      display: flex;
      flex: 0 0 auto;
      gap: clamp(14px, 3vw, 24px);
      color: var(--muted);
      font-size: 14px;
    }

    .hero {
      padding: clamp(34px, 7vw, 62px) 0 24px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      color: #c94f78;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 34px;
      height: 1px;
      background: currentColor;
    }

    h1,
    h2,
    h3,
    p {
      overflow-wrap: anywhere;
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 7vw, 72px);
      line-height: 1;
      letter-spacing: 0;
    }

    .intro {
      max-width: 660px;
      margin: 20px 0 0;
      color: var(--muted);
      font-size: clamp(16px, 2vw, 18px);
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin: 22px 0 24px;
    }

    .step {
      min-height: 54px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.72);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .step.is-active {
      border-color: rgba(231, 95, 139, 0.38);
      background: #fff1f5;
      color: #c94f78;
    }

    .checkout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 18px;
      align-items: start;
      padding-bottom: clamp(46px, 8vw, 72px);
    }

    .panel,
    .summary {
      border: 1px solid rgba(247, 169, 189, 0.34);
      border-radius: 8px;
      background: var(--white);
      box-shadow: 0 24px 58px rgba(247, 169, 189, 0.12);
    }

    .panel {
      padding: clamp(20px, 4vw, 30px);
    }

    .summary {
      position: sticky;
      top: 18px;
      padding: 22px;
    }

    .form-step {
      display: none;
    }

    .form-step.is-active {
      display: block;
    }

    h2 {
      margin: 0 0 18px;
      font-size: clamp(24px, 3.4vw, 34px);
      line-height: 1.12;
      letter-spacing: 0;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .field {
      display: grid;
      gap: 7px;
      margin-bottom: 16px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      color: var(--ink);
      font-size: 13px;
      font-weight: 800;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      background: #fff8fb;
      color: var(--ink);
      font: inherit;
      outline: none;
    }

    textarea {
      min-height: 96px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: rgba(231, 95, 139, 0.5);
      box-shadow: 0 0 0 3px rgba(247, 169, 189, 0.18);
    }

    .product-options,
    .pay-options {
      display: grid;
      gap: 10px;
    }

    .option {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff8fb;
      cursor: pointer;
    }

    .option input {
      width: auto;
      min-height: auto;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 24px;
    }

    .button {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 22px;
      border: 1px solid #f0a8b9;
      border-radius: 999px;
      color: var(--white);
      background: var(--pink-strong);
      cursor: pointer;
      font: inherit;
      font-size: 15px;
      font-weight: 800;
      text-align: center;
      transition: transform 180ms ease, box-shadow 180ms ease;
      box-shadow: 0 16px 32px rgba(231, 95, 139, 0.18);
    }

    .button.secondary {
      color: var(--ink);
      background: rgba(255, 255, 255, 0.78);
      box-shadow: none;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 36px rgba(247, 169, 189, 0.18);
    }

    .summary h3 {
      margin: 0 0 12px;
      font-size: 20px;
      line-height: 1.2;
    }

    .summary-list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
      color: var(--muted);
      font-size: 14px;
    }

    .summary-list li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }

    .summary-list strong {
      color: var(--ink);
      font-weight: 800;
      text-align: right;
    }

    .cart-review {
      display: grid;
      gap: 12px;
      margin-bottom: 20px;
    }

    .cart-review-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff8fb;
    }

    .cart-review-item span:first-child {
      flex: 1;
    }

    .cart-review-item span:last-child {
      font-weight: 800;
      color: var(--pink-strong);
    }

    .cart-empty {
      padding: 20px;
      border: 1px dashed rgba(247, 169, 189, 0.58);
      border-radius: 8px;
      background: #fff8fb;
      color: var(--muted);
      text-align: center;
    }

    .cart-empty strong {
      display: block;
      margin-bottom: 8px;
      color: var(--ink);
    }

    .success {
      display: none;
      padding: clamp(24px, 5vw, 34px);
      border: 1px solid rgba(247, 169, 189, 0.34);
      border-radius: 8px;
      background: linear-gradient(135deg, #fff1f5 0%, #ffffff 54%, #fff7df 100%);
      box-shadow: 0 24px 58px rgba(247, 169, 189, 0.16);
    }

    .success.is-open {
      display: block;
    }

    .success-code {
      display: inline-flex;
      margin: 12px 0 0;
      padding: 8px 12px;
      border: 1px solid rgba(247, 169, 189, 0.42);
      border-radius: 999px;
      color: #c94f78;
      background: var(--white);
      font-weight: 800;
    }

    footer {
      padding: 0 0 46px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 820px) {
      .checkout {
        grid-template-columns: 1fr;
      }

      .summary {
        position: static;
      }

      .steps,
      .field-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {
      :root {
        --side: 14px;
      }

      .nav {
        align-items: flex-start;
        flex-direction: column;
      }

      .nav-links {
        width: 100%;
        justify-content: space-between;
        padding-top: 12px;
        border-top: 1px solid rgba(247, 169, 189, 0.24);
      }

      .actions {
        display: grid;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <nav class="nav" aria-label="主导航">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">蜂</span>
        <span>小蜜蜂的神秘商店</span>
      </a>
      <div class="nav-links">
        <a href="index.html#about">介绍</a>
        <a href="products.html">商品</a>
        <a href="checkout.html">下单</a>
      </div>
    </nav>

    <section class="hero">
      <span class="eyebrow">Checkout</span>
      <h1>确认订单</h1>
      <p class="intro">最后确认一次商品清单，补上收货地址和备注，就可以送出订单啦。</p>
    </section>

    <section class="success" id="success">
      <h2>订单提交成功！</h2>
      <p>我已经收到您的订单，会尽快核对商品、价格和配送安排。</p>
      <span class="success-code" id="orderCode"></span>
    </section>

    <form class="checkout" id="checkoutForm">
      <div class="panel">
        <section>
          <h2>核对商品清单</h2>
          <div class="cart-review" id="cartReview"></div>
        </section>

        <section>
          <h2>收货与备注</h2>
          <div class="field">
            <label for="address">收货地址</label>
            <textarea id="address" name="address" autocomplete="street-address" required placeholder="填写详细收货地址，方便后续配送"></textarea>
          </div>
          <div class="field">
            <label for="note">备注</label>
            <textarea id="note" name="note" placeholder="想补充送货时间、替换偏好或祝福语，都可以写在这里（可选）"></textarea>
          </div>
          <div class="actions">
            <button class="button" id="submitOrder" type="submit">确认并提交</button>
          </div>
        </section>
      </div>

      <aside class="summary" aria-label="订单摘要">
        <h3>订单摘要</h3>
        <p id="summaryCount">共 0 件商品</p>
        <ul class="summary-list" id="summaryItems"></ul>
        <div class="cart-total">
          <span>商品合计</span>
          <strong id="summaryTotal">¥0</strong>
        </div>
      </aside>
    </form>
  </main>

  <footer>
    © 2026 小蜜蜂的神秘商店 · 让喜欢有回应 · 让心愿有着落
  </footer>

  <script src="config.js"></script>
  <script>
    const form = document.querySelector("#checkoutForm");
    const success = document.querySelector("#success");
    const orderCode = document.querySelector("#orderCode");
    const cartReview = document.querySelector("#cartReview");
    const summaryItems = document.querySelector("#summaryItems");
    const summaryCount = document.querySelector("#summaryCount");
    const summaryTotal = document.querySelector("#summaryTotal");
    const addressInput = document.querySelector("#address");
    const noteInput = document.querySelector("#note");
    const submitButton = document.querySelector("#submitOrder");

    function getCart() {
      try {
        return JSON.parse(localStorage.getItem("beeCart") || "[]");
      } catch {
        return [];
      }
    }

    function saveCart(cart) {
      localStorage.setItem("beeCart", JSON.stringify(cart));
    }

    function formatPrice(value) {
      if (value === null || value === undefined || value === "") {
        return "待定";
      }
      return `¥${Number(value || 0).toFixed(0)}`;
    }

    function getCartTotal(cart) {
      if (!cart.length) return 0;
      if (cart.some((item) => item.price === null || item.price === undefined || item.price === "")) {
        return null;
      }
      return cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
    }

    function renderCartReview() {
      const cart = getCart();
      const count = cart.reduce((sum, item) => sum + item.quantity, 0);
      summaryCount.textContent = `共 ${count} 件商品`;
      summaryItems.innerHTML = cart.length
        ? cart.map((item) => `
            <li>
              <span>${item.name} × ${item.quantity}</span>
              <strong>${formatPrice(item.price === null || item.price === undefined || item.price === "" ? null : item.price * item.quantity)}</strong>
            </li>
          `).join("")
        : `<li>购物车空了，请先返回商品页添加商品。</li>`;
      const total = getCartTotal(cart);
      summaryTotal.textContent = total === null ? "待定" : `¥${total}`;

      cartReview.innerHTML = cart.length
        ? cart.map((item) => `
            <div class="cart-review-item">
              <span>
                <strong>${item.name}</strong><br>
                <small>${item.category}</small>
              </span>
              <span>${item.quantity} 件</span>
            </div>
          `).join("")
        : `<div class="cart-empty">
              <strong>购物车还是空的</strong>
              <p>先挑选商品加入购物车，再回到这里核对并提交。</p>
              <a href="products.html" class="button secondary" style="margin-top: 12px;">去挑商品</a>
            </div>`;

      submitButton.disabled = cart.length === 0;
    }

    function getApiUrl(path) {
      if (window.BEE_ORDER_API_BASE) {
        return `${window.BEE_ORDER_API_BASE.replace(/\/$/, "")}${path}`;
      }
      const isLocalHost = ["localhost", "127.0.0.1"].includes(window.location.hostname);
      const isStaticPreview = window.location.protocol === "file:" || (isLocalHost && window.location.port && window.location.port !== "3000");
      return isStaticPreview ? `http://127.0.0.1:3000${path}` : path;
    }

    async function submitOrder(event) {
      event.preventDefault();
      if (!form.reportValidity()) return;
      const cart = getCart();
      if (!cart.length) return;

      const order = {
        items: cart,
        product: cart.map((item) => `${item.name} x${item.quantity}`).join("；"),
        quantity: cart.reduce((sum, item) => sum + item.quantity, 0),
        category: [...new Set(cart.map((item) => item.category))].join("；"),
        address: addressInput.value.trim() || "未填写",
        note: noteInput.value.trim() || "无",
        submittedAt: new Date().toISOString()
      };

      submitButton.disabled = true;
      submitButton.textContent = "正在提交...";

      try {
        const response = await fetch(getApiUrl("/api/orders"), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(order)
        });

        if (!response.ok) {
          throw new Error("订单提交失败");
        }

        const result = await response.json();
        orderCode.textContent = result.orderCode ? `订单编号：${result.orderCode}` : "";
        success.classList.add("is-open");
        form.style.display = "none";
        saveCart([]);
        window.scrollTo({ top: 0, behavior: "smooth" });
      } catch (error) {
        console.error(error);
        alert("提交失败，请稍后再试。");
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "确认并提交";
      }
    }

    function ensureDirectOrderCart() {
      const cart = getCart();
      const query = new URLSearchParams(window.location.search);
      const selectedCategory = query.get("category");
      const selectedProduct = query.get("product");
      if (!cart.length && selectedProduct) {
        saveCart([
          {
            id: selectedProduct,
            name: selectedProduct,
            category: selectedCategory || "未分类",
            price: null,
            quantity: 1
          }
        ]);
      }
    }

    form.addEventListener("submit", submitOrder);
    window.addEventListener("DOMContentLoaded", () => {
      ensureDirectOrderCart();
      renderCartReview();
    });
  </script>
</body>
</html>
